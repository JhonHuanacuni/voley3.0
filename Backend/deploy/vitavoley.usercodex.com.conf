<VirtualHost *:80>
    ServerName vitavoley.usercodex.com

    DocumentRoot /home/usercodex/vitavoley_front
    <Directory /home/usercodex/vitavoley_front>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass /api/ http://127.0.0.1:8006/api/
    ProxyPassReverse /api/ http://127.0.0.1:8006/api/

    ProxyPass /media/ !
    Alias /media/ /home/usercodex/vitavoley_src/Backend/media/
    <Directory /home/usercodex/vitavoley_src/Backend/media>
        Options -Indexes
        Require all granted
    </Directory>

    Alias /static/ /home/usercodex/vitavoley_src/Backend/staticfiles/
    <Directory /home/usercodex/vitavoley_src/Backend/staticfiles>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/vitavoley_error.log
    CustomLog ${APACHE_LOG_DIR}/vitavoley_access.log combined
</VirtualHost>
